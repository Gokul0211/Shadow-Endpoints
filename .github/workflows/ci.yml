name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        run: |
          pip install -e .
          cd analysis && npm ci --ignore-scripts
      - name: Python tests (the offline SPABench tests skip unless SPABENCH_DIR is set)
        run: python -W error::ResourceWarning -m unittest discover -s tests
      - name: Value-flow tests
        run: cd analysis && node --test test/analyze.test.js
